      <stop offset="0" stop-color="#087f4b"/>
      <stop offset="1" stop-color="#00a65a"/>
    </linearGradient>
    <linearGradient id="redBg" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d71920"/>
      <stop offset="1" stop-color="#ef3030"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06232d"/>
      <stop offset="1" stop-color="#031820"/>
