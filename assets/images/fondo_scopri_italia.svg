    <path d="M0 215 C45 150 72 85 105 0" fill="none" stroke="#165d31" stroke-width="9" stroke-linecap="round"/>
    <path d="M42 150 C15 125 2 104 -8 75 C27 82 55 105 64 130Z" fill="#4d963c"/>
    <path d="M70 105 C100 72 122 55 151 52 C135 87 109 108 78 119Z" fill="#3c8736"/>
