  <!-- Green Leaves -->
  <path d="M30 45 C65 25, 75 60, 30 45 Z" fill="#2D6A4F"/>
  <path d="M22 105 C-12 80, 0 125, 22 105 Z" fill="#1B4332"/>
  <path d="M38 150 C75 130, 85 170, 38 150 Z" fill="#40916C"/>
  <path d="M30 195 C-8 175, 5 215, 30 195 Z" fill="#2D6A4F"/>
  <!-- Lemons -->
  <g filter="url(#dropShadow)">
    <ellipse cx="55" cy="80" rx="24" ry="32" transform="rotate(-20 55 80)" fill="#FFD166" stroke="#F4A261" stroke-width="2"/>
    <ellipse cx="30" cy="160" rx="22" ry="28" transform="rotate(25 30 160)" fill="#FFC300" stroke="#F4A261" stroke-width="2"/>
  </g>
  <defs>
    <filter id="dropShadow" x="0" y="40" width="100" height="160" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.18"/>
